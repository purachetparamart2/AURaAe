<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutsuto - Anime Scene Archive & DaVinci Resolve Assets</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Noto Sans Thai & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans Thai"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        },
                        neutral: {
                            25: '#fcfcfc',
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Noto Sans Thai', 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .glass-nav {
            background: rgba(248, 250, 252, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body x-data="appData()" class="min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Bar -->
    <nav class="sticky top-0 z-40 glass-nav transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Brand -->
                <div class="flex items-center gap-3 cursor-pointer" @click="currentView = 'home'; selectedAnime = null">
                    <div class="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                        K
                    </div>
                    <div>
                        <span class="font-bold text-slate-900 text-lg tracking-tight">KUTSUTO</span>
                        <span class="text-xs bg-emerald-100 text-emerald-800 font-medium px-2 py-0.5 rounded-full ml-2">Clean Archive</span>
                    </div>
                </div>

                <!-- Navigation Links -->
                <div class="hidden md:flex items-center gap-1 bg-slate-100/80 p-1 rounded-xl border border-slate-200/60">
                    <button @click="currentView = 'home'; selectedAnime = null" 
                            :class="currentView === 'home' && !selectedAnime ? 'bg-white shadow-sm text-slate-900 font-semibold' : 'text-slate-600 hover:text-slate-900'"
                            class="px-4 py-1.5 text-sm rounded-lg transition-all flex items-center gap-2">
                        <i data-lucide="film" class="w-4 h-4"></i>
                        <span>คลังอนิเมะ</span>
                    </button>
                    <button @click="currentView = 'presets'; selectedAnime = null" 
                            :class="currentView === 'presets' ? 'bg-white shadow-sm text-slate-900 font-semibold' : 'text-slate-600 hover:text-slate-900'"
                            class="px-4 py-1.5 text-sm rounded-lg transition-all flex items-center gap-2">
                        <i data-lucide="sliders" class="w-4 h-4"></i>
                        <span>DaVinci Presets & LUTs</span>
                    </button>
                    <button @click="currentView = 'about'" 
                            :class="currentView === 'about' ? 'bg-white shadow-sm text-slate-900 font-semibold' : 'text-slate-600 hover:text-slate-900'"
                            class="px-4 py-1.5 text-sm rounded-lg transition-all flex items-center gap-2">
                        <i data-lucide="info" class="w-4 h-4"></i>
                        <span>เกี่ยวกับระบบ</span>
                    </button>
                </div>

                <!-- Search Input Header -->
                <div class="relative max-w-xs w-full hidden sm:block">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" 
                           x-model="searchQuery" 
                           placeholder="ค้นหาอนิเมะ, ฉาก, แท็ก หรือ Preset..."
                           class="w-full pl-9 pr-4 py-1.5 bg-slate-100/90 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:bg-white transition-all">
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- VIEW 1: HOME PAGE / ANIME DIRECTORY -->
        <template x-if="currentView === 'home' && !selectedAnime">
            <div class="space-y-8">
                <!-- Hero Section -->
                <div class="text-center max-w-3xl mx-auto py-6">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 mb-4">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-emerald-600"></i>
                        ศูนย์รวมฉากอนิเมะคุณภาพสูง & DaVinci Resolve Assets
                    </span>
                    <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 tracking-tight leading-tight">
                        รวมทุกฉากตัดอนิเมะ ค้นหาง่าย พร้อมใช้สำหรับ Video Editor
                    </h1>
                    <p class="mt-3 text-slate-600 text-sm sm:text-base leading-relaxed">
                        รวบรวมฉากอนิเมะแบบละเอียดยิบตามตอนและช่วงเวลา พร้อมไฟล์โปรเจกต์ DaVinci Resolve (.drp), Fusion Macro และ Color LUT สำหรับนักตัดต่อวิดีโอโดยเฉพาะ
                    </p>

                    <!-- Mobile Search Field -->
                    <div class="mt-6 sm:hidden relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" 
                               x-model="searchQuery" 
                               placeholder="ค้นหาอนิเมะหรือฉาก..."
                               class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
                    </div>
                </div>

                <!-- Genre/Category Quick Filters -->
                <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                    <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1">
                        <button @click="selectedCategory = 'All'" 
                                :class="selectedCategory === 'All' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                                class="px-3.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all">
                            ทั้งหมด
                        </button>
                        <template x-for="cat in categories" :key="cat">
                            <button @click="selectedCategory = cat" 
                                    :class="selectedCategory === cat ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                                    class="px-3.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all"
                                    x-text="cat">
                            </button>
                        </template>
                    </div>
                    <span class="text-xs text-slate-400 hidden sm:inline-block" x-text="filteredAnimeList.length + ' รายการ'"></span>
                </div>

                <!-- Anime Cards Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <template x-for="anime in filteredAnimeList" :key="anime.id">
                        <div @click="openAnimeDetail(anime)" 
                             class="glass-card rounded-2xl overflow-hidden hover:shadow-lg transition-all duration-300 group cursor-pointer border border-slate-200/80 flex flex-col">
                            <!-- Thumbnail Cover -->
                            <div class="relative aspect-video bg-slate-200 overflow-hidden">
                                <img :src="anime.coverImage" :alt="anime.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/70 via-transparent to-transparent"></div>
                                <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-md text-slate-800 text-[10px] font-bold px-2 py-0.5 rounded-md shadow-sm">
                                    <span x-text="anime.year"></span>
                                </div>
                                <div class="absolute bottom-3 left-3 right-3 flex justify-between items-end text-white">
                                    <div class="text-xs font-medium flex items-center gap-1.5">
                                        <i data-lucide="layers" class="w-3.5 h-3.5 text-emerald-400"></i>
                                        <span x-text="anime.episodesCount + ' ตอน'"></span>
                                        <span class="text-slate-300">•</span>
                                        <span x-text="anime.scenes.length + ' ฉากตัด'"></span>
                                    </div>
                                </div>
                            </div>
                            <!-- Card Body -->
                            <div class="p-4 flex-grow flex flex-col justify-between">
                                <div>
                                    <h3 class="font-bold text-slate-900 group-hover:text-emerald-600 transition-colors line-clamp-1" x-text="anime.title"></h3>
                                    <p class="text-xs text-slate-500 mt-1 line-clamp-2 leading-relaxed" x-text="anime.description"></p>
                                </div>
                                <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                                    <div class="flex gap-1 flex-wrap">
                                        <template x-for="tag in anime.tags.slice(0, 2)" :key="tag">
                                            <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md text-[10px]" x-text="tag"></span>
                                        </template>
                                    </div>
                                    <span class="text-emerald-600 font-medium flex items-center gap-1 group-hover:translate-x-0.5 transition-transform">
                                        ดูฉากทั้งหมด
                                        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- VIEW 2: DEDICATED ANIME SCENE COMPENDIUM (ฉากทุกฉากในเรื่องเดียว) -->
        <template x-if="selectedAnime">
            <div class="space-y-6">
                <!-- Back Navigation & Breadcrumb -->
                <div class="flex items-center justify-between">
                    <button @click="selectedAnime = null" class="inline-flex items-center gap-2 text-xs sm:text-sm text-slate-600 hover:text-slate-900 bg-white border border-slate-200 px-3 py-1.5 rounded-xl shadow-sm transition-all">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span>ย้อนกลับไปคลังอนิเมะ</span>
                    </button>
                    <div class="text-xs text-slate-500">
                        <span class="text-slate-400">อนิเมะ</span> / <span class="font-medium text-slate-800" x-text="selectedAnime.title"></span>
                    </div>
                </div>

                <!-- Anime Header Banner -->
                <div class="glass-card rounded-2xl p-6 sm:p-8 relative overflow-hidden border border-slate-200/80">
                    <div class="flex flex-col md:flex-row gap-6 items-start">
                        <img :src="selectedAnime.coverImage" :alt="selectedAnime.title" class="w-full md:w-56 h-40 md:h-64 object-cover rounded-xl shadow-md border border-slate-200">
                        <div class="flex-grow space-y-3">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-md" x-text="selectedAnime.year"></span>
                                <span class="bg-slate-100 text-slate-700 text-xs font-medium px-2.5 py-1 rounded-md" x-text="selectedAnime.studio"></span>
                                <span class="bg-slate-100 text-slate-700 text-xs font-medium px-2.5 py-1 rounded-md" x-text="selectedAnime.episodesCount + ' ตอนเต็ม'"></span>
                            </div>
                            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900" x-text="selectedAnime.title"></h1>
                            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed max-w-3xl" x-text="selectedAnime.description"></p>
                            
                            <!-- Tags & Stats -->
                            <div class="pt-2 flex flex-wrap gap-2">
                                <template x-for="tag in selectedAnime.tags" :key="tag">
                                    <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg border border-slate-200/60" x-text="'#' + tag"></span>
                                </template>
                            </div>

                            <div class="pt-4 flex items-center gap-6 text-xs text-slate-500 border-t border-slate-200/60">
                                <div>
                                    <span class="block text-slate-400">จำนวนฉากที่จัดเก็บ</span>
                                    <span class="text-base font-bold text-slate-800" x-text="selectedAnime.scenes.length + ' ฉาก'"></span>
                                </div>
                                <div>
                                    <span class="block text-slate-400">รองรับ DaVinci Resolve</span>
                                    <span class="text-base font-bold text-emerald-600">.DRP / LUT / Node Data</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Episode & Arc Filter Controls -->
                <div class="glass-card p-4 rounded-xl flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
                    <!-- Episode Selector Buttons -->
                    <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1 sm:pb-0">
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider mr-1">เลือกตอน:</span>
                        <button @click="selectedEpisodeFilter = 'All'"
                                :class="selectedEpisodeFilter === 'All' ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                                class="px-3 py-1.5 text-xs font-medium rounded-lg transition-all whitespace-nowrap">
                            รวมทุกตอน (Timeline)
                        </button>
                        <template x-for="ep in getEpisodesList(selectedAnime)" :key="ep">
                            <button @click="selectedEpisodeFilter = ep"
                                    :class="selectedEpisodeFilter === ep ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                                    class="px-3 py-1.5 text-xs font-medium rounded-lg transition-all whitespace-nowrap"
                                    x-text="'ตอนที่ ' + ep">
                            </button>
                        </template>
                    </div>

                    <!-- Search within anime -->
                    <div class="relative min-w-[200px]">
                        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" 
                               x-model="sceneSearchQuery" 
                               placeholder="ค้นหาฉากในเรื่องนี้..." 
                               class="w-full pl-8 pr-3 py-1.5 bg-slate-100/80 border border-slate-200 rounded-lg text-xs text-slate-800 focus:outline-none focus:bg-white">
                    </div>
                </div>

                <!-- Scene Timeline Gallery Grid -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                            <i data-lucide="clapperboard" class="w-4 h-4 text-emerald-600"></i>
                            รายการฉากตัดตามไทม์ไลน์ (Scene Cut Compendium)
                        </h2>
                        <span class="text-xs text-slate-500" x-text="'แสดง ' + filteredAnimeScenes.length + ' ฉาก'"></span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        <template x-for="scene in filteredAnimeScenes" :key="scene.id">
                            <div class="glass-card rounded-xl overflow-hidden hover:shadow-md transition-all border border-slate-200/80 flex flex-col group">
                                <!-- Video Preview / Thumbnail -->
                                <div class="relative aspect-video bg-slate-900 overflow-hidden cursor-pointer" @click="openVideoModal(scene)">
                                    <img :src="scene.thumbnail" :alt="scene.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                    <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors flex items-center justify-center">
                                        <div class="w-10 h-10 rounded-full bg-white/90 text-slate-900 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                                            <i data-lucide="play" class="w-5 h-5 fill-slate-900 translate-x-0.5"></i>
                                        </div>
                                    </div>
                                    <!-- Timestamp Badge -->
                                    <div class="absolute bottom-2 left-2 bg-slate-900/80 backdrop-blur-sm text-white text-[11px] font-mono px-2 py-0.5 rounded">
                                        <span x-text="'EP.' + scene.episode"></span> • <span x-text="scene.timestamp"></span>
                                    </div>
                                    <div class="absolute top-2 right-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">
                                        <span x-text="scene.fps + ' FPS'"></span>
                                    </div>
                                </div>

                                <!-- Scene Metadata -->
                                <div class="p-4 flex-grow flex flex-col justify-between space-y-3">
                                    <div>
                                        <div class="flex items-center justify-between gap-2 mb-1">
                                            <span class="text-[11px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded" x-text="scene.category"></span>
                                            <span class="text-[11px] text-slate-400 font-mono" x-text="'Cut ID: #' + scene.id"></span>
                                        </div>
                                        <h3 class="font-bold text-slate-800 text-sm group-hover:text-emerald-600 transition-colors line-clamp-1" x-text="scene.title"></h3>
                                        <p class="text-xs text-slate-500 mt-1 line-clamp-2" x-text="scene.description"></p>
                                    </div>

                                    <!-- DaVinci Resolve Specs Info -->
                                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200/60 text-[11px] space-y-1">
                                        <div class="flex justify-between text-slate-600">
                                            <span class="text-slate-400">Color Profile:</span>
                                            <span class="font-medium" x-text="scene.colorSpace"></span>
                                        </div>
                                        <div class="flex justify-between text-slate-600">
                                            <span class="text-slate-400">Preset LUT ที่แนะนำ:</span>
                                            <span class="font-medium text-emerald-700" x-text="scene.recommendedLUT"></span>
                                        </div>
                                    </div>

                                    <!-- Actions -->
                                    <div class="flex items-center gap-2 pt-1">
                                        <button @click="openVideoModal(scene)" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium py-1.5 px-3 rounded-lg flex items-center justify-center gap-1.5 transition-colors">
                                            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                            <span>เปิดดูฉาก / Node Data</span>
                                        </button>
                                        <button @click="downloadSceneAsset(scene)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 text-xs font-medium py-1.5 px-3 rounded-lg flex items-center justify-center gap-1 transition-colors" title="ดาวน์โหลดคลิป / Preset">
                                            <i data-lucide="download" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- VIEW 3: DAVINCI RESOLVE ASSETS & PRESETS MARKETPLACE -->
        <template x-if="currentView === 'presets'">
            <div class="space-y-6">
                <!-- Page Header -->
                <div class="border-b border-slate-200 pb-5">
                    <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                        <i data-lucide="sliders" class="w-6 h-6 text-emerald-600"></i>
                        คลัง DaVinci Resolve Presets & LUTs
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-600 mt-1">
                        ดาวน์โหลด Color Grading LUTs, Fusion Titles, Macros และไฟล์โปรเจกต์ (.drp) ปรับแต่งมาเพื่ออนิเมะโดยเฉพาะ
                    </p>
                </div>

                <!-- Asset Type Filter Tabs -->
                <div class="flex items-center gap-2 border-b border-slate-200 pb-3 overflow-x-auto custom-scrollbar">
                    <button @click="selectedPresetType = 'All'"
                            :class="selectedPresetType === 'All' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                            class="px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all">
                        ทั้งหมด
                    </button>
                    <button @click="selectedPresetType = 'LUT'"
                            :class="selectedPresetType === 'LUT' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                            class="px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all">
                        Color LUTs (.cube)
                    </button>
                    <button @click="selectedPresetType = 'Project'"
                            :class="selectedPresetType === 'Project' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                            class="px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all">
                        Project Files (.drp)
                    </button>
                    <button @click="selectedPresetType = 'Macro'"
                            :class="selectedPresetType === 'Macro' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                            class="px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all">
                        Fusion Macros / Motion
                    </button>
                </div>

                <!-- Presets Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="preset in filteredPresets" :key="preset.id">
                        <div class="glass-card rounded-xl p-5 border border-slate-200/80 flex flex-col justify-between hover:shadow-md transition-all">
                            <div class="space-y-3">

                    this.selectedEpisodeFilter = 'All';
                    this.sceneSearchQuery = '';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                openVideoModal(scene) {
                    this.activeVideoModal = scene;
                    this.isPlaying = false;
                    this.copiedNotice = false;
                    this.$nextTick(() => lucide.createIcons());
                },

                togglePlayState() {
                    this.isPlaying = !this.isPlaying;
                    this.$nextTick(() => lucide.createIcons());
                },

                copyNodeData() {
                    if (!this.activeVideoModal) return;
                    navigator.clipboard.writeText(this.activeVideoModal.nodeData || '');
                    this.copiedNotice = true;
                    this.showToast('คัดลอก DaVinci Node Data เรียบร้อยแล้ว!');
                    setTimeout(() => { this.copiedNotice = false; }, 3000);
                },

                downloadSceneAsset(scene) {
                    this.showToast(`กำลังเตรียมดาวน์โหลดไฟล์ฉาก: ${scene.title}`);
                },

                downloadPresetModal(preset) {
                    this.activePresetModal = preset;
                    this.$nextTick(() => lucide.createIcons());
                },

                triggerDownloadPreset() {
                    this.showToast(`เริ่มดาวน์โหลด ${this.activePresetModal.title}`);
                    this.activePresetModal = null;
                },

                showToast(msg) {
                    this.toastMessage = msg;
                    setTimeout(() => { this.toastMessage = ''; }, 3500);
                }
            }
        }

        // Initialize Lucide Icons on load
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
